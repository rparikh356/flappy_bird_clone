<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Flappy Bird</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}
canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
(function(){

/* ─── canvas & context ─── */
const C = document.getElementById('c');
const ctx = C.getContext('2d', {alpha:false});

/* ─── game dimensions (logical) ─── */
const W = 480, H = 854;   // 9:16 portrait base

/* ─── scale to fill viewport ─── */
let scale=1, offX=0, offY=0;
function resize(){
  const vw=window.innerWidth, vh=window.innerHeight;
  C.width=vw; C.height=vh;
  const s=Math.min(vw/W, vh/H);
  scale=s;
  offX=(vw-W*s)/2; offY=(vh-H*s)/2;
}
window.addEventListener('resize',resize);
resize();

/* ─── helpers ─── */
function lx(x){return offX+x*scale;}
function ly(y){return offY+y*scale;}
function ls(v){return v*scale;}

/* pointer to logical coords */
function ptl(e){
  const r=C.getBoundingClientRect();
  const cx=(e.clientX??e.touches[0].clientX)-r.left;
  const cy=(e.clientY??e.touches[0].clientY)-r.top;
  return {x:(cx-offX)/scale, y:(cy-offY)/scale};
}

/* ─── constants ─── */
const GRAVITY   = 1800;   // px/s² (logical)
const FLAP_V    = -520;   // px/s
const PIPE_W    = 72;
const PIPE_GAP  = 175;
const PIPE_SPD  = 200;    // px/s
const SPAWN_INT = 1.55;   // seconds between pipes
const GND_H     = 90;
const BIRD_CX   = 130;    // fixed x
const BIRD_RX   = 22, BIRD_RY = 16;  // ellipse radii

/* ─── state ─── */
const ST = {MENU:0, PLAY:1, DEAD:2};
let state, bird, pipes, score, best, tick, spawnT, flashT, particles, scrollX;

function initGame(){
  best = +localStorage.getItem('fb_best')||0;
  bird = {y:H/2-40, vy:0, angle:0, wing:0, wingDir:-1, wingT:0};
  pipes=[]; score=0; tick=0; spawnT=0; flashT=0; particles=[];
  scrollX=0; state=ST.MENU;
}

/* ─── particle system ─── */
function spawnParticles(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=80+Math.random()*200;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,col,r:3+Math.random()*4});
  }
}

/* ─── pipe factory ─── */
function addPipe(){
  const minT=120, maxT=H-GND_H-PIPE_GAP-120;
  const topH=minT+Math.random()*(maxT-minT);
  pipes.push({x:W+PIPE_W, topH, scored:false});
}

/* ─── collision: ellipse vs rect ─── */
function ellipseHitRect(ex,ey,rx,ry,rLeft,rTop,rW,rH){
  const cx=Math.max(rLeft,Math.min(ex,rLeft+rW));
  const cy=Math.max(rTop, Math.min(ey,rTop+rH));
  const dx=(ex-cx)/rx, dy=(ey-cy)/ry;
  return dx*dx+dy*dy<=1;
}

/* ─── buttons ─── */
const BTNS={};
function defBtn(id,x,y,w,h){BTNS[id]={x,y,w,h,hover:false};}
function hitBtn(id,px,py){
  const b=BTNS[id];
  return px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h;
}
function drawBtn(id,label,accent){
  const b=BTNS[id];
  const x=b.x,y=b.y,w=b.w,h=b.h,r=h/2;
  ctx.save();
  ctx.translate(offX,offY); ctx.scale(scale,scale);
  // shadow
  ctx.shadowColor='rgba(0,0,0,0.4)';
  ctx.shadowBlur=ls(12); ctx.shadowOffsetY=ls(4);
  // body
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,b.hover?lighten(accent,40):lighten(accent,20));
  g.addColorStop(1,b.hover?accent:darken(accent,10));
  ctx.fillStyle=g;
  roundRect(x,y,w,h,r);
  ctx.fill();
  ctx.shadowColor='transparent';
  // border
  ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=2;
  roundRect(x,y,w,h,r); ctx.stroke();
  // shine
  ctx.fillStyle='rgba(255,255,255,0.18)';
  roundRect(x+4,y+4,w-8,h/2-4,r-2); ctx.fill();
  // label
  ctx.fillStyle='#fff';
  ctx.font=`bold ${Math.round(h*0.38)}px 'Segoe UI',Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=ls(4);
  ctx.fillText(label,x+w/2,y+h/2+1);
  ctx.restore();
}

function lighten(hex,amt){return shiftColor(hex,amt);}
function darken(hex,amt){return shiftColor(hex,-amt);}
function shiftColor(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,Math.min(255,r+amt));
  g=Math.max(0,Math.min(255,g+amt));
  b=Math.max(0,Math.min(255,b+amt));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

/* ─── input ─── */
let pointerDown=false, lastPt={x:0,y:0};

function onPointerDown(e){
  e.preventDefault();
  pointerDown=true;
  const p=ptl(e);
  lastPt=p;
  if(state===ST.MENU){
    if(hitBtn('start',p.x,p.y)) startGame();
  } else if(state===ST.DEAD){
    if(hitBtn('restart',p.x,p.y)) initGame(), startGame();
  } else if(state===ST.PLAY){
    flap();
  }
}
function onPointerMove(e){
  const p=ptl(e); lastPt=p;
  if(BTNS.start)  BTNS.start.hover  = hitBtn('start',p.x,p.y);
  if(BTNS.restart)BTNS.restart.hover= hitBtn('restart',p.x,p.y);
}
function onPointerUp(e){ pointerDown=false; }
function onKey(e){
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW') e.preventDefault(), handleKey();
  if(e.code==='KeyF') toggleFS();
}
function handleKey(){
  if(state===ST.MENU) startGame();
  else if(state===ST.PLAY) flap();
  else if(state===ST.DEAD) initGame(), startGame();
}
function flap(){
  bird.vy=FLAP_V;
  bird.wingDir=-1; bird.wingT=0;
  spawnParticles(BIRD_CX-10,bird.y+5,'rgba(255,230,100,0.7)',5);
}
function startGame(){ state=ST.PLAY; flap(); }

C.addEventListener('pointerdown',onPointerDown,{passive:false});
C.addEventListener('pointermove',onPointerMove);
C.addEventListener('pointerup',onPointerUp);
document.addEventListener('keydown',onKey);

/* fullscreen */
function toggleFS(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

/* ─── pre-render cloud sprite ─── */
function makeCloudSprite(w,h){
  const oc=document.createElement('canvas');
  oc.width=w; oc.height=h;
  const x=ctx2=oc.getContext('2d');
  x.fillStyle='rgba(255,255,255,0.92)';
  x.beginPath();
  x.ellipse(w*0.5,h*0.62,w*0.4,h*0.38,0,0,Math.PI*2); x.fill();
  x.beginPath();
  x.ellipse(w*0.3,h*0.55,w*0.28,h*0.32,0,0,Math.PI*2); x.fill();
  x.beginPath();
  x.ellipse(w*0.72,h*0.58,w*0.25,h*0.28,0,0,Math.PI*2); x.fill();
  x.beginPath();
  x.ellipse(w*0.5,h*0.42,w*0.32,h*0.35,0,0,Math.PI*2); x.fill();
  // soft top fade
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(255,255,255,0)');
  g.addColorStop(0.4,'rgba(255,255,255,0)');
  g.addColorStop(1,'rgba(200,230,255,0.5)');
  x.fillStyle=g; x.fillRect(0,0,w,h);
  return oc;
}
const cloudSprites=[makeCloudSprite(160,80), makeCloudSprite(220,100), makeCloudSprite(130,65)];

/* ─── cloud layer data ─── */
const clouds=[
  {x:80,  y:90,  si:0, spd:0.18},
  {x:310, y:60,  si:1, spd:0.14},
  {x:430, y:130, si:2, spd:0.20},
  {x:160, y:200, si:1, spd:0.12},
  {x:550, y:80,  si:0, spd:0.16},
];

/* ─── mountain layer ─── */
function makeMtns(){
  const pts=[];
  for(let x=0;x<=W+80;x+=40){
    pts.push({x, y:H-GND_H-80-Math.random()*180});
  }
  return pts;
}
const mtns1=makeMtns(), mtns2=makeMtns();

/* ─── draw sky ─── */
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H-GND_H);
  g.addColorStop(0,'#1a6fb5');
  g.addColorStop(0.3,'#2e9fd4');
  g.addColorStop(0.7,'#7ecef4');
  g.addColorStop(1,'#bde8f8');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H-GND_H);
}

function drawSun(){
  const sx=W-70, sy=75;
  // glow
  const g=ctx.createRadialGradient(sx,sy,10,sx,sy,70);
  g.addColorStop(0,'rgba(255,230,100,0.5)');
  g.addColorStop(1,'rgba(255,200,50,0)');
  ctx.fillStyle=g; ctx.fillRect(sx-70,sy-70,140,140);
  // disc
  const g2=ctx.createRadialGradient(sx-5,sy-5,3,sx,sy,28);
  g2.addColorStop(0,'#fff9c4'); g2.addColorStop(1,'#ffd740');
  ctx.fillStyle=g2;
  ctx.beginPath(); ctx.arc(sx,sy,28,0,Math.PI*2); ctx.fill();
}

function drawMountains(pts,col,ox){
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.moveTo(pts[0].x+ox,H-GND_H);
  for(const p of pts) ctx.lineTo(p.x+ox,p.y);
  ctx.lineTo(pts[pts.length-1].x+ox,H-GND_H);
  ctx.closePath(); ctx.fill();
}

function drawClouds(dt){
  for(const cl of clouds){
    cl.x-=cl.spd*(dt*60);
    const sp=cloudSprites[cl.si];
    if(cl.x+sp.width<0) cl.x=W+20;
    ctx.globalAlpha=0.88;
    ctx.drawImage(sp, cl.x, cl.y, sp.width, sp.height);
    ctx.globalAlpha=1;
  }
}

function drawGround(dt){
  // dirt
  const dg=ctx.createLinearGradient(0,H-GND_H,0,H);
  dg.addColorStop(0,'#c8973f'); dg.addColorStop(1,'#8b5e2a');
  ctx.fillStyle=dg; ctx.fillRect(0,H-GND_H,W,GND_H);
  // grass
  const gg=ctx.createLinearGradient(0,H-GND_H,0,H-GND_H+22);
  gg.addColorStop(0,'#5ecc40'); gg.addColorStop(1,'#3a9922');
  ctx.fillStyle=gg; ctx.fillRect(0,H-GND_H,W,22);
  // scrolling detail stripes
  const stripe=60;
  for(let i=0;i<Math.ceil(W/stripe)+1;i++){
    const sx=((scrollX*0.8)%stripe+i*stripe+stripe)%( (Math.ceil(W/stripe)+2)*stripe )-stripe;
    ctx.fillStyle='rgba(0,0,0,0.08)';
    ctx.fillRect(sx,H-GND_H,22,22);
  }
  // top border
  ctx.fillStyle='#7adf55';
  ctx.fillRect(0,H-GND_H,W,5);
}

/* ─── draw pipe ─── */
function drawPipe(x,topH){
  const r=8, capH=32, capW=PIPE_W+14, capX=x-(capW-PIPE_W)/2;

  function tube(tx,ty,tw,th){
    // base gradient
    const g=ctx.createLinearGradient(tx,0,tx+tw,0);
    g.addColorStop(0,'#2d6e1f');
    g.addColorStop(0.15,'#3e9628');
    g.addColorStop(0.4,'#6dc94d');
    g.addColorStop(0.65,'#3e9628');
    g.addColorStop(1,'#1f5216');
    ctx.fillStyle=g;
    ctx.fillRect(tx,ty,tw,th);
    // right shadow
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(tx+tw-12,ty,12,th);
    // left highlight
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(tx,ty,8,th);
  }

  function cap(cx,cy,cw,ch,isTop){
    const g=ctx.createLinearGradient(cx,0,cx+cw,0);
    g.addColorStop(0,'#245a18');
    g.addColorStop(0.15,'#3a8824');
    g.addColorStop(0.42,'#72d450');
    g.addColorStop(0.68,'#3a8824');
    g.addColorStop(1,'#1a4210');
    ctx.fillStyle=g;
    ctx.beginPath();
    if(isTop){
      ctx.moveTo(cx+r,cy); ctx.lineTo(cx+cw-r,cy);
      ctx.arcTo(cx+cw,cy,cx+cw,cy+r,r);
      ctx.lineTo(cx+cw,cy+ch); ctx.lineTo(cx,cy+ch);
      ctx.lineTo(cx,cy+r); ctx.arcTo(cx,cy,cx+r,cy,r);
    } else {
      ctx.moveTo(cx,cy); ctx.lineTo(cx+cw,cy);
      ctx.lineTo(cx+cw,cy+ch-r);
      ctx.arcTo(cx+cw,cy+ch,cx+cw-r,cy+ch,r);
      ctx.lineTo(cx+r,cy+ch); ctx.arcTo(cx,cy+ch,cx,cy+ch-r,r);
      ctx.lineTo(cx,cy);
    }
    ctx.closePath(); ctx.fill();
    // cap highlight
    ctx.fillStyle='rgba(255,255,255,0.13)';
    ctx.fillRect(cx+6,cy+(isTop?2:4),10,ch-6);
    // cap bottom edge shadow
    ctx.fillStyle='rgba(0,0,0,0.15)';
    ctx.fillRect(cx,cy+(isTop?ch-4:0),cw,4);
  }

  // top pipe
  tube(x,0,PIPE_W,topH-capH);
  cap(capX,topH-capH,capW,capH,true);

  // bottom pipe
  const botY=topH+PIPE_GAP;
  const botH=H-GND_H-botY;
  cap(capX,botY,capW,capH,false);
  tube(x,botY+capH,PIPE_W,botH-capH);
}

/* ─── draw realistic bird ─── */
function drawBird(dt){
  // wing animation
  bird.wingT+=dt*8;
  bird.wing=Math.sin(bird.wingT)*35;

  // rotate toward velocity
  const targetAngle=Math.max(-28,Math.min(85, bird.vy*0.07));
  bird.angle+=(targetAngle-bird.angle)*0.18;

  ctx.save();
  ctx.translate(BIRD_CX, bird.y);
  ctx.rotate(bird.angle*Math.PI/180);

  // drop shadow
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.25)'; ctx.shadowBlur=10; ctx.shadowOffsetY=5;
  ctx.fillStyle='transparent';
  ctx.beginPath(); ctx.ellipse(0,0,BIRD_RX,BIRD_RY,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // tail
  ctx.fillStyle='#d4880a';
  ctx.beginPath();
  ctx.moveTo(-BIRD_RX+2,4);
  ctx.lineTo(-BIRD_RX-16,10);
  ctx.lineTo(-BIRD_RX-14,-2);
  ctx.lineTo(-BIRD_RX-8,0);
  ctx.lineTo(-BIRD_RX-16,-8);
  ctx.lineTo(-BIRD_RX+2,-4);
  ctx.closePath(); ctx.fill();
  // tail shading
  ctx.fillStyle='rgba(0,0,0,0.15)';
  ctx.beginPath();
  ctx.moveTo(-BIRD_RX+2,4);
  ctx.lineTo(-BIRD_RX-16,10);
  ctx.lineTo(-BIRD_RX-8,0);
  ctx.closePath(); ctx.fill();

  // lower wing (back)
  ctx.save();
  ctx.rotate(-(bird.wing+20)*Math.PI/180);
  const wg2=ctx.createLinearGradient(0,0,-20,22);
  wg2.addColorStop(0,'#c47a0a'); wg2.addColorStop(1,'#8a5200');
  ctx.fillStyle=wg2;
  ctx.beginPath();
  ctx.moveTo(-6,2); ctx.quadraticCurveTo(-4,20,-22,24);
  ctx.quadraticCurveTo(-28,12,-8,0); ctx.closePath(); ctx.fill();
  ctx.restore();

  // body
  const bg=ctx.createRadialGradient(-4,-5,2,2,0,BIRD_RX+4);
  bg.addColorStop(0,'#ffe566');
  bg.addColorStop(0.45,'#f5c200');
  bg.addColorStop(0.78,'#e08b00');
  bg.addColorStop(1,'#b85e00');
  ctx.fillStyle=bg;
  ctx.beginPath(); ctx.ellipse(0,0,BIRD_RX,BIRD_RY,0,0,Math.PI*2); ctx.fill();

  // body feather texture
  ctx.strokeStyle='rgba(180,100,0,0.18)'; ctx.lineWidth=1;
  for(let i=-1;i<=1;i++){
    ctx.beginPath();
    ctx.ellipse(i*7,-2,5,9,0.3,0,Math.PI); ctx.stroke();
  }

  // upper wing (front)
  ctx.save();
  ctx.rotate(-bird.wing*Math.PI/180);
  const wg=ctx.createLinearGradient(0,0,-14,20);
  wg.addColorStop(0,'#f5c200'); wg.addColorStop(0.5,'#d4880a'); wg.addColorStop(1,'#8a5200');
  ctx.fillStyle=wg;
  ctx.beginPath();
  ctx.moveTo(-3,0); ctx.quadraticCurveTo(-2,16,-18,20);
  ctx.quadraticCurveTo(-24,10,-6,-2); ctx.closePath(); ctx.fill();
  // wing highlight
  ctx.fillStyle='rgba(255,230,80,0.25)';
  ctx.beginPath();
  ctx.moveTo(-3,0); ctx.quadraticCurveTo(-2,8,-11,12);
  ctx.quadraticCurveTo(-15,6,-6,-2); ctx.closePath(); ctx.fill();
  ctx.restore();

  // white chest patch
  ctx.fillStyle='rgba(255,255,220,0.55)';
  ctx.beginPath(); ctx.ellipse(6,4,9,7,0.4,0,Math.PI*2); ctx.fill();

  // head (slightly larger circle offset up-right)
  const hg=ctx.createRadialGradient(12,-10,2,14,-8,13);
  hg.addColorStop(0,'#ffe97a'); hg.addColorStop(0.6,'#f5c200'); hg.addColorStop(1,'#c47a00');
  ctx.fillStyle=hg;
  ctx.beginPath(); ctx.arc(14,-9,13,0,Math.PI*2); ctx.fill();

  // eye white
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(20,-13,6,5.5,0.2,0,Math.PI*2); ctx.fill();

  // iris
  const ig=ctx.createRadialGradient(21,-13,0,21,-13,4);
  ig.addColorStop(0,'#4a2800'); ig.addColorStop(0.5,'#1a0a00'); ig.addColorStop(1,'#000');
  ctx.fillStyle=ig;
  ctx.beginPath(); ctx.arc(21,-13,4,0,Math.PI*2); ctx.fill();

  // eye shine
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(22.5,-15,1.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(19.5,-11,0.8,0,Math.PI*2); ctx.fill();

  // eyelid
  ctx.strokeStyle='rgba(150,90,0,0.4)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(20,-13,6,-0.5,Math.PI+0.5); ctx.stroke();

  // beak
  const bkG=ctx.createLinearGradient(24,-8,32,-5);
  bkG.addColorStop(0,'#ff8c00'); bkG.addColorStop(1,'#e06000');
  ctx.fillStyle=bkG;
  ctx.beginPath();
  ctx.moveTo(24,-9); ctx.lineTo(34,-7); ctx.lineTo(24,-4); ctx.closePath(); ctx.fill();
  // beak line
  ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(24,-7); ctx.lineTo(33,-7); ctx.stroke();
  // nostril
  ctx.fillStyle='rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(26.5,-8.5,1.2,0.8,0.3,0,Math.PI*2); ctx.fill();

  // body outline
  ctx.strokeStyle='rgba(120,60,0,0.25)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.ellipse(0,0,BIRD_RX,BIRD_RY,0,0,Math.PI*2); ctx.stroke();

  ctx.restore();
}

/* ─── particles ─── */
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=400*dt;
    p.life-=dt*1.8;
    if(p.life<=0) particles.splice(i,1);
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

/* ─── score flash ─── */
function drawScore(){
  const fs=flashT>0?Math.round(44+flashT*10):44;
  ctx.save();
  ctx.font=`bold ${fs}px 'Segoe UI',Arial,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.fillText(score, W/2+2, 28);
  ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=8;
  ctx.fillText(score, W/2, 26);
  ctx.restore();
}

/* ─── screens ─── */
function drawPanel(x,y,w,h){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=30; ctx.shadowOffsetY=8;
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(20,40,80,0.92)');
  g.addColorStop(1,'rgba(10,20,50,0.96)');
  ctx.fillStyle=g;
  roundRect(x,y,w,h,22); ctx.fill();
  ctx.shadowColor='transparent';
  ctx.strokeStyle='rgba(100,160,255,0.3)'; ctx.lineWidth=2;
  roundRect(x,y,w,h,22); ctx.stroke();
  ctx.restore();
}

function drawMenuScreen(){
  const pw=340, ph=340, px=(W-pw)/2, py=(H-ph)/2-60;
  drawPanel(px,py,pw,ph);

  // title
  ctx.save();
  ctx.textAlign='center';
  ctx.font="bold 46px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#ffd740';
  ctx.shadowColor='rgba(255,180,0,0.6)'; ctx.shadowBlur=20;
  ctx.fillText('FLAPPY BIRD', W/2, py+58);
  ctx.shadowColor='transparent';

  // bird icon
  ctx.font='52px serif';
  ctx.fillText('🐦', W/2, py+130);

  // best
  ctx.font="18px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#aad4ff';
  ctx.fillText(`Best: ${best}`, W/2, py+175);

  // key hint
  ctx.font="15px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='rgba(180,210,255,0.7)';
  ctx.fillText('Space / Arrow Up / Tap', W/2, py+210);
  ctx.restore();

  defBtn('start',(W-220)/2,py+240,220,60);
  drawBtn('start','▶  START','#2979ff');
}

function drawDeadScreen(){
  const pw=340, ph=320, px=(W-pw)/2, py=(H-ph)/2-40;
  drawPanel(px,py,pw,ph);
  ctx.save();
  ctx.textAlign='center';

  ctx.font="bold 38px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#ff5252';
  ctx.shadowColor='rgba(255,0,0,0.4)'; ctx.shadowBlur=16;
  ctx.fillText('GAME OVER', W/2, py+52);
  ctx.shadowColor='transparent';

  ctx.font="bold 26px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#fff';
  ctx.fillText(`Score: ${score}`, W/2, py+110);

  ctx.font="20px 'Segoe UI',Arial,sans-serif";
  ctx.fillStyle='#ffd740';
  ctx.fillText(`Best: ${best}`, W/2, py+150);

  if(score>=best && score>0){
    ctx.font="bold 16px 'Segoe UI',Arial,sans-serif";
    ctx.fillStyle='#69ff47';
    ctx.shadowColor='rgba(100,255,50,0.5)'; ctx.shadowBlur=10;
    ctx.fillText('🏆 NEW BEST!', W/2, py+182);
    ctx.shadowColor='transparent';
  }
  ctx.restore();

  defBtn('restart',(W-220)/2,py+218,220,60);
  drawBtn('restart','↺  PLAY AGAIN','#00c853');
}

/* ─── full-screen button (corner) ─── */
function drawFSBtn(){
  const bx=W-46, by=10, bw=36, bh=28;
  defBtn('fs',bx,by,bw,bh);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5;
  roundRect(bx,by,bw,bh,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='13px monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('⛶',bx+bw/2,by+bh/2+1);
  ctx.restore();
}

/* ─── update ─── */
function update(dt){
  scrollX+=PIPE_SPD*dt;

  if(state!==ST.PLAY) return;

  // bird physics
  bird.vy+=GRAVITY*dt;
  bird.y +=bird.vy*dt;
  if(flashT>0) flashT=Math.max(0,flashT-dt*4);

  // spawn pipes
  spawnT+=dt;
  if(spawnT>=SPAWN_INT){ spawnT-=SPAWN_INT; addPipe(); }

  // move pipes, score
  for(const p of pipes){
    p.x-=PIPE_SPD*dt;
    if(!p.scored && p.x+PIPE_W<BIRD_CX-BIRD_RX){
      p.scored=true; score++;
      if(score>best){ best=score; localStorage.setItem('fb_best',best); }
      flashT=1;
      spawnParticles(BIRD_CX,bird.y,'rgba(255,210,0,0.9)',12);
    }
  }
  pipes=pipes.filter(p=>p.x+PIPE_W>-20);

  // collision
  const hitGround=bird.y+BIRD_RY>=H-GND_H;
  const hitCeil=bird.y-BIRD_RY<=0;
  let hitPipe=false;
  const m=4;
  for(const p of pipes){
    if(ellipseHitRect(BIRD_CX,bird.y,BIRD_RX-m,BIRD_RY-m,p.x,0,PIPE_W,p.topH)
    || ellipseHitRect(BIRD_CX,bird.y,BIRD_RX-m,BIRD_RY-m,p.x,p.topH+PIPE_GAP,PIPE_W,H-GND_H-(p.topH+PIPE_GAP))){
      hitPipe=true; break;
    }
  }
  if(hitGround||hitCeil||hitPipe){
    spawnParticles(BIRD_CX,bird.y,'rgba(255,100,50,0.9)',20);
    state=ST.DEAD;
  }
}

/* ─── render ─── */
function render(dt){
  ctx.save();
  ctx.translate(offX,offY); ctx.scale(scale,scale);

  drawSky();
  drawSun();

  const mo=-scrollX*0.04;
  drawMountains(mtns1,'rgba(80,110,160,0.55)',mo%W);
  drawMountains(mtns1,'rgba(80,110,160,0.55)',mo%W+W);
  const mo2=-scrollX*0.065;
  drawMountains(mtns2,'rgba(60,90,130,0.4)',mo2%W);
  drawMountains(mtns2,'rgba(60,90,130,0.4)',mo2%W+W);

  drawClouds(state===ST.PLAY?dt:0);

  for(const p of pipes) drawPipe(p.x,p.topH);

  drawGround(dt);
  drawParticles();
  drawBird(dt);

  if(state===ST.PLAY||state===ST.DEAD) drawScore();
  if(state===ST.MENU) drawMenuScreen();
  if(state===ST.DEAD) drawDeadScreen();

  drawFSBtn();

  ctx.restore();
}

/* ─── game loop (delta-time, 120fps-ready) ─── */
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const raw=(t-lastT)/1000;
  lastT=t;
  const dt=Math.min(raw,0.05); // clamp to avoid spiral of death
  updateParticles(dt);
  update(dt);
  render(dt);
}

/* ─── fullscreen button click ─── */
const origPointerDown=C.onpointerdown;
C.addEventListener('pointerdown',function(e){
  const p=ptl(e);
  if(BTNS.fs && hitBtn('fs',p.x,p.y)){ e.stopImmediatePropagation(); toggleFS(); }
},{capture:true,passive:false});

/* ─── start ─── */
initGame();
requestAnimationFrame(function(t){ lastT=t; requestAnimationFrame(loop); });

})();
</script>
